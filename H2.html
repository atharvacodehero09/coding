<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OPD Patient Registration Slip</title>
</head>
<body>
  <h2 align="center">Dhulikhel Community Hospital<br><small>OPD Patient Registration Slip</small></h2>
  <hr>

  <form action="#" method="post">

    <fieldset>
      <legend><b>1. Patient Details</b></legend>
      <table>
        <tr>
          <td><label for="pname">Patient Name</label></td>
          <td><input type="text" id="pname" name="patient_name" size="30" required></td>
          <td><label for="age">Age</label></td>
          <td><input type="number" id="age" name="age" min="0" max="100" size="4"> years</td>
        </tr>
        <tr>
          <td>Sex</td>
          <td>
            <input type="radio" id="m" name="sex" value="male"><label for="m">Male</label>
            <input type="radio" id="f" name="sex" value="female"><label for="f">Female</label>
            <input type="radio" id="o" name="sex" value="other"><label for="o">Other</label>
          </td>
          <td><label for="bg">Blood Group</label></td>
          <td>
            <select id="bg" name="blood_group">
              <option value="unknown" disabled selected>Unknown</option>
              <option>A+</option>
              <option>A-</option>
              <option>B+</option>
              <option>B-</option>
              <option>AB+</option>
              <option>AB-</option>
              <option>O+</option>
              <option>O-</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><label for="addr">Address</label></td>
          <td colspan="3"><input type="text" id="addr" name="address" size="70" placeholder="Municipality, Ward No., Tole"></td>
        </tr>
      </table>

      <fieldset>
        <legend><i>1.1 Emergency Contact</i></legend>
        <label for="ecname">Name</label>
        <input type="text" id="ecname" name="emergency_name">
        <label for="ecrel">Relation</label>
        <select id="ecrel" name="emergency_relation">
          <option>Father</option>
          <option>Mother</option>
          <option>Spouse</option>
          <option>Son</option>
          <option>Daughter</option>
          <option>Sibling</option>
          <option>Other</option>
        </select>
        <label for="ecphone">Phone</label>
        <input type="tel" id="ecphone" name="emergency_phone">
      </fieldset>
    </fieldset>

    <fieldset>
      <legend><b>2. Visit Details</b></legend>
      <table>
        <tr>
          <td valign="top"><label for="dept">Department</label></td>
          <td valign="top">
            <select id="dept" name="department" size="8">
              <optgroup label="Medicine">
                <option value="general_medicine">General Medicine</option>
                <option value="cardiology">Cardiology</option>
                <option value="neurology">Neurology</option>
              </optgroup>
              <optgroup label="Surgery">
                <option value="general_surgery">General Surgery</option>
                <option value="orthopaedics">Orthopaedics</option>
              </optgroup>
              <optgroup label="Others">
                <option value="paediatrics">Paediatrics</option>
                <option value="dental">Dental</option>
              </optgroup>
            </select>
          </td>
          <td valign="top">
            <label for="vdate">Visit Date</label><br>
            <input type="date" id="vdate" name="visit_date"><br><br>
            <label for="vtime">Preferred Time</label><br>
            <input type="time" id="vtime" name="visit_time"><br><br>
            Visit Type<br>
            <input type="radio" id="vt_new" name="visit_type" value="new" checked><label for="vt_new">New</label>
            <input type="radio" id="vt_fu" name="visit_type" value="followup"><label for="vt_fu">Follow-up</label>
          </td>
        </tr>
      </table>

      <p>
        Symptoms (tick all that apply):<br>
        <input type="checkbox" id="sy1" name="symptoms" value="fever"><label for="sy1">Fever</label>
        <input type="checkbox" id="sy2" name="symptoms" value="cough"><label for="sy2">Cough</label>
        <input type="checkbox" id="sy3" name="symptoms" value="headache"><label for="sy3">Headache</label>
        <input type="checkbox" id="sy4" name="symptoms" value="chest_pain"><label for="sy4">Chest Pain</label>
        <input type="checkbox" id="sy5" name="symptoms" value="injury"><label for="sy5">Injury</label>
        <input type="checkbox" id="sy6" name="symptoms" value="other"><label for="sy6">Other</label>
      </p>

      <p>
        <label for="problem">Describe the problem and any medicine you are already taking:</label><br>
        <textarea id="problem" name="problem" rows="3" cols="70"></textarea>
      </p>
    </fieldset>

    <p align="center">
      <input type="submit" value="Generate OPD Ticket">
      <input type="reset" value="Reset">
    </p>
  </form>
</body>
</html>
